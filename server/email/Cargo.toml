[package]
name = "email"
version = "0.1.0"
edition = "2024"

[lints]
workspace = true

[dependencies]
lettre = { version = "0.11.22", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "builder", "smtp-transport", "pool"] }
tracing = "0.1.44"
opentelemetry = { version = "0.21", features = ["metrics"] }
tokio = { version = "1", features = ["time"] }

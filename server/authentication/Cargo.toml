[package]
name = "authentication"
version = "0.1.0"
edition = "2021"

[dependencies]
argon2 = { version = "0.5", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", features = ["postgres", "runtime-tokio", "tls-rustls"] }
rand = "0.8"

[dev-dependencies]
quality = { path = "../../quality" }
tokio = { version = "1", features = ["full"] }

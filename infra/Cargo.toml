[package]
name = "infra"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate"] }
tokio = { version = "1", features = ["full"] }
base = { path = "../base" }


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistas Portal - Password Setup</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Google Sans', 'Outfit', sans-serif;
        }
        :root {
            --background: #FFFFFF;
            --foreground: #111827;
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --secondary: #10B981;
            --accent: #F59E0B;
            --muted: #F3F4F6;
            --muted-foreground: #6B7280;
            --border: #E5E7EB;
            --radius-md: 6px;
            --radius-lg: 8px;
        }
        body {
            background-color: var(--muted);
            color: var(--foreground);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }

        .bg-shape-1 {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(59, 130, 246, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: 1;
            pointer-events: none;
        }
        .bg-shape-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.06) 0%, rgba(16, 185, 129, 0) 70%);
            bottom: -150px;
            left: -150px;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            position: relative;
            z-index: 10;
        }
        @media (max-width: 480px) {
            .container { padding: 16px; }
            .display-title { font-size: 2.5rem !important; }
            .card { padding: 24px 20px !important; }
        }
        .display-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .display-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            color: var(--primary);
            margin: 0 0 4px 0;
            line-height: 0.9;
        }
        .display-subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted-foreground);
            margin: 0;
        }
        .card {
            background-color: var(--background);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: none;
            border: none;
            transition: transform 0.2s ease;
        }
        .card:hover {
            transform: scale(1.01);
        }
        h2 {
            font-size: 1.75rem;
            margin: 0 0 8px 0;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--foreground);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 2px solid transparent;
            background-color: var(--muted);
            color: var(--foreground);
            font-size: 15px;
            transition: all 0.2s ease;
        }
        input::placeholder {
            color: var(--muted-foreground);
            opacity: 0.7;
        }
        input:focus {
            outline: none;
            background-color: var(--background);
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius-md);
            border: none;
            background-color: var(--primary);
            color: var(--background);
            font-weight: 700;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 16px;
        }
        button:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }
        button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        .success-banner {
            display: none;
            text-align: center;
            background-color: #ECFDF5;
            border: 1px solid var(--secondary);
            color: #065F46;
            padding: 16px;
            border-radius: var(--radius-md);
            margin-bottom: 25px;
            font-weight: 600;
            font-size: 0.875rem;
        }
        .error-msg {
            color: #EF4444;
            font-size: 0.8125rem;
            margin-top: 24px;
            text-align: center;
            display: none;
            background-color: #FEE2E2;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 600;
        }
        .password-constraints {
            background-color: var(--background);
            border: 1px solid var(--border);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-top: 8px;
            margin-bottom: 24px;
        }
        .constraint {
            font-size: 0.8125rem;
            color: var(--muted-foreground);
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
            font-weight: 500;
        }
        .constraint:last-child {
            margin-bottom: 0;
        }
        .constraint.valid {
            color: var(--secondary);
        }
        .constraint.valid::before {
            content: "✓";
            font-weight: 800;
        }
        .constraint.invalid::before {
            content: "○";
        }
        button:disabled {
            background-color: var(--muted-foreground);
            opacity: 0.5;
            cursor: not-allowed;
        }
        button:disabled:hover {
            transform: none;
        }
    </style>
</head>
<body>
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <div class="container">
        <div class="display-header">
            <h1 class="display-title">Vistas</h1>
            <div class="display-subtitle">Access Portal</div>
        </div>

        <div class="card">
            <h2>Setup Password</h2>
            <div class="subtitle">Complete your profile setup by setting a new strong password.</div>

            <div class="success-banner" id="success-banner">
                ✓ Password saved successfully! Redirecting to login...
            </div>
            
            <form id="reset-form">
                <div class="form-group">
                    <label for="password">New Password</label>
                    <input type="password" id="password" required placeholder="••••••••" minlength="8">
                </div>
                <div class="password-constraints">
                    <div id="constraint-length" class="constraint invalid">At least 8 characters</div>
                    <div id="constraint-number" class="constraint invalid">Contains at least one number</div>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Confirm Password</label>
                    <input type="password" id="confirm-password" required placeholder="••••••••" minlength="8">
                </div>
                <button type="submit" id="submit-btn" disabled>Set Password</button>
            </form>

            <div class="error-msg" id="error-msg"></div>
        </div>
    </div>

    <script>
        const API_BASE = "";

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const form = document.getElementById('reset-form');
        const errorMsg = document.getElementById('error-msg');
        const successBanner = document.getElementById('success-banner');
        
        const passwordInput = document.getElementById('password');
        const submitBtn = document.getElementById('submit-btn');
        const lengthConstraint = document.getElementById('constraint-length');
        const numberConstraint = document.getElementById('constraint-number');

        if (!token) {
            errorMsg.textContent = 'Error: Invalid or missing setup token. Please request a new link.';
            errorMsg.style.display = 'block';
            form.style.display = 'none';
        }

        passwordInput.addEventListener('input', () => {
            const pwd = passwordInput.value;
            let isValid = true;

            if (pwd.length >= 8) {
                lengthConstraint.classList.add('valid');
                lengthConstraint.classList.remove('invalid');
            } else {
                lengthConstraint.classList.add('invalid');
                lengthConstraint.classList.remove('valid');
                isValid = false;
            }

            if (/\d/.test(pwd)) {
                numberConstraint.classList.add('valid');
                numberConstraint.classList.remove('invalid');
            } else {
                numberConstraint.classList.add('invalid');
                numberConstraint.classList.remove('valid');
                isValid = false;
            }

            submitBtn.disabled = !isValid;
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                errorMsg.textContent = 'Passwords do not match';
                errorMsg.style.display = 'block';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    successBanner.style.display = 'block';
                    form.style.display = 'none';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    errorMsg.textContent = data.message || 'Setup failed';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Failed to connect to backend server';
                errorMsg.style.display = 'block';
            }
        });
    </script>
</body>
</html>

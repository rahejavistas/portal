<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistas Portal: Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Google Sans', 'Outfit', sans-serif;
        }
        :root {
            --background: #FFFFFF;
            --foreground: #111827;
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --secondary: #10B981;
            --accent: #F59E0B;
            --muted: #F3F4F6;
            --muted-foreground: #6B7280;
            --border: #E5E7EB;
            --radius-md: 6px;
            --radius-lg: 8px;
        }
        body {
            background-color: var(--muted);
            color: var(--foreground);
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
        }
        
        .bg-shape-1 {
            position: fixed;
            width: 400px;
            height: 400px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.08) 0%, rgba(59, 130, 246, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: 1;
            pointer-events: none;
        }
        .bg-shape-2 {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(16, 185, 129, 0.06) 0%, rgba(16, 185, 129, 0) 70%);
            bottom: -150px;
            left: -150px;
            z-index: 1;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 24px;
            position: relative;
            z-index: 10;
        }
        @media (max-width: 480px) {
            .container {
                padding: 16px;
            }
            .display-title {
                font-size: 2.5rem !important;
            }
            .login-card {
                padding: 24px 20px !important;
            }
        }
        .display-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .display-title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            color: var(--primary);
            margin: 0 0 4px 0;
            line-height: 0.9;
        }
        .display-subtitle {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: var(--muted-foreground);
            margin: 0;
        }
        .login-card {
            background-color: var(--background);
            border-radius: var(--radius-lg);
            padding: 40px;
            box-shadow: none;
            border: none;
            transition: transform 0.2s ease;
        }
        .login-card:hover {
            transform: scale(1.01);
        }
        h2 {
            font-size: 1.75rem;
            margin: 0 0 8px 0;
            font-weight: 800;
            letter-spacing: -0.02em;
        }
        .subtitle {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            margin-bottom: 32px;
            line-height: 1.5;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: var(--foreground);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border-radius: var(--radius-md);
            border: 2px solid transparent;
            background-color: var(--muted);
            color: var(--foreground);
            font-size: 15px;
            transition: all 0.2s ease;
        }
        input::placeholder {
            color: var(--muted-foreground);
            opacity: 0.7;
        }
        input:focus {
            outline: none;
            background-color: var(--background);
            border-color: var(--primary);
        }
        button {
            width: 100%;
            padding: 15px;
            border-radius: var(--radius-md);
            border: none;
            background-color: var(--primary);
            color: var(--background);
            font-weight: 700;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 16px;
        }
        button:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }
        button:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
        .error-msg {
            color: #EF4444;
            font-size: 0.8125rem;
            margin-top: 24px;
            text-align: center;
            display: none;
            background-color: #FEE2E2;
            padding: 12px;
            border-radius: var(--radius-md);
            font-weight: 600;
        }
        .helper-links {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 32px;
            font-size: 0.8125rem;
            border-top: 2px solid var(--muted);
            padding-top: 20px;
        }
        .helper-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }
        .helper-links a:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="bg-shape-1"></div>
    <div class="bg-shape-2"></div>

    <div class="container">
        <div class="display-header">
            <h1 class="display-title">Vistas</h1>
            <div class="display-subtitle">Access Portal</div>
        </div>
        
        <div class="login-card" id="login-card">
            <h2>Sign In</h2>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" required placeholder="name@vistas.com">
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit">Sign In to Account</button>
                <div class="error-msg" id="error-msg">Invalid email or password</div>
            </form>
            <div class="helper-links">
                <a href="/forgot-password">Reset Password</a>
            </div>
        </div>

        <div class="login-card" id="otp-card" style="display:none;">
            <h2>Check Your Email</h2>
            <p class="subtitle" style="margin-bottom:20px;">We sent a 6-digit code to your email. Enter it below to finish signing in.</p>
            <form id="otp-form">
                <div class="form-group">
                    <label for="otp-code">Verification Code</label>
                    <input type="text" id="otp-code" required placeholder="000000" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" style="letter-spacing:0.4em; text-align:center; font-size:20px; font-weight:700;">
                </div>
                <button type="submit">Verify &amp; Sign In</button>
                <div class="error-msg" id="otp-error-msg"></div>
            </form>
            <div class="helper-links">
                <a href="javascript:void(0)" id="otp-resend-link">Resend Code</a>
                <a href="javascript:void(0)" id="otp-back-link">Use a Different Account</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "";

        function postLoginRedirectUrl() {
            const target = new URLSearchParams(window.location.search).get('redirect');
            if (target) {
                try {
                    const url = new URL(target, window.location.origin);
                    if (url.origin === window.location.origin) {
                        return url.href;
                    }
                } catch (e) {}
            }
            return '/dashboard';
        }

        if (localStorage.getItem('vfs_token')) {
            window.location.href = postLoginRedirectUrl();
        }

        const form = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        let pendingToken = null;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const response = await fetch(`${API_BASE}/api/v1/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    localStorage.setItem('vfs_token', data.token);
                    localStorage.setItem('vfs_user', JSON.stringify(data.user));
                    window.location.href = postLoginRedirectUrl();
                } else if (response.ok && data.mfa_required) {
                    pendingToken = data.pending_token;
                    document.getElementById('login-card').style.display = 'none';
                    document.getElementById('otp-card').style.display = 'block';
                    document.getElementById('otp-error-msg').style.display = 'none';
                    document.getElementById('otp-code').value = '';
                    document.getElementById('otp-code').focus();
                } else {
                    errorMsg.textContent = data.message || 'Invalid email or password';
                    errorMsg.style.display = 'block';
                }
            } catch (err) {
                errorMsg.textContent = 'Failed to connect to backend server';
                errorMsg.style.display = 'block';
            }
        });

        const otpForm = document.getElementById('otp-form');
        const otpErrorMsg = document.getElementById('otp-error-msg');
        const otpCodeInput = document.getElementById('otp-code');

        otpCodeInput.addEventListener('input', () => {
            otpCodeInput.value = otpCodeInput.value.replace(/[^0-9]/g, '');
        });

        otpForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            otpErrorMsg.style.display = 'none';
            const code = document.getElementById('otp-code').value.trim();

            try {
                const response = await fetch(`${API_BASE}/api/v1/mfa/verify`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pending_token: pendingToken, code })
                });
                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    localStorage.setItem('vfs_token', data.token);
                    localStorage.setItem('vfs_user', JSON.stringify(data.user));
                    window.location.href = postLoginRedirectUrl();
                } else {
                    otpErrorMsg.textContent = data.message || 'Incorrect code. Please try again.';
                    otpErrorMsg.style.display = 'block';
                    if (!data.mfa_required) {
                        setTimeout(() => {
                            document.getElementById('otp-card').style.display = 'none';
                            document.getElementById('login-card').style.display = 'block';
                            pendingToken = null;
                        }, 2500);
                    }
                }
            } catch (err) {
                otpErrorMsg.textContent = 'Failed to connect to backend server';
                otpErrorMsg.style.display = 'block';
            }
        });

        document.getElementById('otp-resend-link').addEventListener('click', async (e) => {
            e.preventDefault();
            otpErrorMsg.style.display = 'none';
            try {
                const response = await fetch(`${API_BASE}/api/v1/mfa/resend`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ pending_token: pendingToken })
                });
                const data = await response.json();
                otpErrorMsg.style.display = 'block';
                if (response.ok) {
                    otpErrorMsg.style.background = '#DCFCE7';
                    otpErrorMsg.style.color = '#166534';
                    otpErrorMsg.textContent = data.message || 'A new code has been sent.';
                } else {
                    otpErrorMsg.style.background = '#FEE2E2';
                    otpErrorMsg.style.color = '#EF4444';
                    otpErrorMsg.textContent = data.message || 'Failed to resend code.';
                }
            } catch (err) {
                otpErrorMsg.style.display = 'block';
                otpErrorMsg.textContent = 'Failed to connect to backend server';
            }
        });

        document.getElementById('otp-back-link').addEventListener('click', (e) => {
            e.preventDefault();
            pendingToken = null;
            document.getElementById('otp-card').style.display = 'none';
            document.getElementById('login-card').style.display = 'block';
            document.getElementById('password').value = '';
        });
    </script>
</body>
</html>

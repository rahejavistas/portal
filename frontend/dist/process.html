<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vistas Portal - Processes</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
        }
        html {
            overflow-x: hidden;
        }
        :root {
            --background: #FFFFFF;
            --foreground: #111827;
            --primary: #3B82F6;
            --primary-hover: #2563EB;
            --secondary: #10B981;
            --accent: #F59E0B;
            --danger: #EF4444;
            --muted: #F3F4F6;
            --muted-foreground: #6B7280;
            --border: #E5E7EB;
            --radius-md: 6px;
            --radius-lg: 8px;
        }
        body {
            background-color: var(--muted);
            color: var(--foreground);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            overflow-x: hidden;
            width: 100%;
        }

        .layout-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
        }

        .bg-shape-top-right {
            position: fixed;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.04) 0%, rgba(59, 130, 246, 0) 70%);
            top: -100px;
            right: -100px;
            z-index: 0;
            pointer-events: none;
        }

        /* Sidebar */
        .sidebar {
            width: 260px;
            min-width: 260px;
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 40px 24px;
            justify-content: space-between;
            position: fixed;
            height: 100vh;
            left: 0;
            top: 0;
            z-index: 150;
            background-color: var(--background);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: transform;
        }

        /* Mobile Top Bar */
        .mobile-topbar {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background-color: var(--background);
            border-bottom: 1px solid var(--border);
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 200;
        }
        .mobile-topbar-brand {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            color: var(--primary);
        }
        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            border-radius: var(--radius-md);
            transition: background 0.2s;
        }
        .hamburger-btn:hover { background-color: var(--muted); }
        .hamburger-btn span {
            display: block;
            width: 22px;
            height: 2px;
            background-color: var(--foreground);
            border-radius: 2px;
        }
        .sidebar-overlay {
            display: none;
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0,0,0,0.45);
            z-index: 149;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .sidebar-overlay.open {
            display: block;
            opacity: 1;
        }
        .sidebar-brand h1 {
            font-size: 2.25rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            text-transform: uppercase;
            color: var(--primary);
            margin: 0 0 4px 0;
            line-height: 0.9;
        }
        .sidebar-brand p {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--muted-foreground);
            margin: 0 0 40px 0;
        }
        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex-grow: 1;
        }
        .nav-item {
            display: block;
            padding: 12px 16px;
            border: none;
            border-radius: var(--radius-md);
            color: var(--foreground);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            background: none;
            width: 100%;
        }
        .nav-item:hover {
            background-color: var(--muted);
            transform: scale(1.03);
        }
        .nav-item.active {
            background-color: var(--primary);
            color: var(--background);
        }
        .back-btn {
            display: block;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--foreground);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8125rem;
            text-transform: uppercase;
            text-align: center;
            transition: all 0.2s ease;
            margin-bottom: 12px;
        }
        .back-btn:hover {
            background-color: var(--muted);
            transform: scale(1.03);
        }
        .admin-btn {
            display: block;
            padding: 12px 16px;
            background-color: #FEF3C7;
            color: #D97706;
            border-radius: var(--radius-md);
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8125rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            text-align: center;
            transition: all 0.2s ease;
        }
        .admin-btn:hover {
            background-color: #FDE68A;
            transform: scale(1.05);
        }
        .logout-btn {
            background-color: var(--background);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--foreground);
            padding: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8125rem;
            text-transform: uppercase;
            width: 100%;
            text-align: center;
            transition: all 0.2s ease;
        }
        .logout-btn:hover {
            background-color: #FEE2E2;
            border-color: #FCA5A5;
            color: #EF4444;
            transform: scale(1.03);
        }

        /* Workspace */
        .workspace {
            flex-grow: 1;
            margin-left: 260px;
            padding: 60px 80px;
            max-width: 1200px;
            position: relative;
            z-index: 10;
        }

        h2 {
            font-size: 2.75rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--foreground);
            margin-top: 0;
            margin-bottom: 8px;
        }
        .section-desc {
            font-size: 1.125rem;
            color: var(--muted-foreground);
            margin: 0 0 40px 0;
        }

        /* Tab subtabs */
        .subtab-bar {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 32px;
        }
        .subtab-btn {
            background-color: var(--background);
            border: 2px solid var(--border);
            border-radius: var(--radius-md);
            color: var(--foreground);
            padding: 8px 16px;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .subtab-btn:hover {
            background-color: var(--muted);
            transform: scale(1.03);
        }
        .subtab-btn.active {
            background-color: var(--primary);
            color: var(--background);
            border-color: var(--primary);
        }

        /* Cards */
        .card {
            background-color: var(--background);
            border-radius: var(--radius-lg);
            padding: 40px;
            margin-bottom: 32px;
            box-shadow: none;
            border: none;
        }

        /* Tables */
        .table-container {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 440px;
            border-radius: var(--radius-lg);
            background-color: var(--background);
            margin-top: 16px;
            /* Custom scrollbar */
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
        }
        .table-container::-webkit-scrollbar { width: 6px; height: 6px; }
        .table-container::-webkit-scrollbar-track { background: transparent; }
        .table-container::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 3px; }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        thead th {
            position: sticky;
            top: 0;
            z-index: 2;
        }
        th {
            background-color: #F8FAFC;
            border-bottom: 1px solid var(--border);
            padding: 16px 24px;
            color: var(--muted-foreground);
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            letter-spacing: 0.05em;
        }
        td {
            border-bottom: 1px solid var(--border);
            padding: 20px 24px;
            font-size: 0.9375rem;
            vertical-align: middle;
        }
        tr:last-child td {
            border-bottom: none;
        }
        tr:hover td {
            background-color: #FAFAFA;
        }

        .process-title {
            font-weight: 700;
            font-size: 1rem;
            color: var(--primary);
            cursor: pointer;
            text-decoration: none;
            transition: color 0.15s ease;
            /* Truncate long names with ellipsis */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            max-width: 260px;
        }
        .process-title:hover {
            color: var(--primary-hover);
            text-decoration: underline;
        }

        /* Status Pills */
        .status-pill {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 9999px;
            font-size: 0.6875rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background-color: var(--muted);
            color: var(--muted-foreground);
        }
        .status-pill.completed {
            background-color: #D1FAE5;
            color: #065F46;
        }
        .status-pill.pending_review {
            background-color: #FEF3C7;
            color: #92400E;
        }
        .status-pill.open {
            background-color: #DBEAFE;
            color: #1E40AF;
        }
        .status-pill.locked {
            background-color: var(--muted);
            color: var(--muted-foreground);
        }

        .btn {
            background-color: var(--primary);
            color: var(--background);
            border: none;
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-block;
            text-align: center;
        }
        .btn:hover {
            background-color: var(--primary-hover);
            transform: scale(1.05);
        }
        .btn-secondary {
            background-color: var(--background);
            color: var(--foreground);
            border: 2px solid var(--border);
        }
        .btn-secondary:hover {
            background-color: var(--muted);
        }
        .btn-danger {
            background-color: var(--danger);
        }
        .btn-danger:hover {
            background-color: #DC2626;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-content {
            background: var(--background);
            border-radius: var(--radius-lg);
            width: 100%;
            max-width: 500px;
            padding: 24px;
            position: relative;
        }
        .close-modal-btn {
            position: absolute;
            top: 16px;
            right: 16px;
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--muted-foreground);
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .form-group label {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted-foreground);
            text-transform: uppercase;
        }
        .form-group select, .form-group input {
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            font-size: 0.875rem;
        }

        /* Workspace layout */
        .process-workspace {
            display: flex;
            width: 100%;
            margin-top: 24px;
            align-items: flex-start;
        }
        .process-sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        /* Step list scrolls independently — header and nav stay fixed */
        .process-sidebar-steps {
            max-height: calc(70vh - 80px);
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--border) transparent;
            padding-right: 4px;
        }
        .process-sidebar-steps::-webkit-scrollbar { width: 4px; }
        .process-sidebar-steps::-webkit-scrollbar-track { background: transparent; }
        .process-sidebar-steps::-webkit-scrollbar-thumb { background-color: var(--border); border-radius: 3px; }
        .process-content-panel {
            flex-grow: 1;
            min-width: 0;
            width: 0;
            box-sizing: border-box;
            overflow: hidden;
            background-color: var(--background);
            border-radius: var(--radius-lg);
            padding: 32px;
            border: 1px solid var(--border);
        }
        /* step-stages-toggle shown only on mobile via @media above — now unused but kept for compat */
        .step-stages-toggle { display: none; }

        /* Mobile step pill bar — same pattern as working document filter bar */
        .mobile-step-pill-bar {
            display: none;
            overflow-x: auto;
            gap: 8px;
            padding-bottom: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .mobile-step-pill-bar::-webkit-scrollbar { display: none; }
        .mobile-step-pill {
            flex-shrink: 0;
            padding: 8px 14px;
            border-radius: 9999px;
            border: 2px solid var(--border);
            background: var(--background);
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--muted-foreground);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .mobile-step-pill:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .mobile-step-pill.active {
            background: var(--primary);
            border-color: var(--primary);
            color: #fff;
        }
        .mobile-step-pill.completed {
            border-color: var(--secondary);
            color: var(--secondary);
        }
        .mobile-step-pill.active.completed {
            background: var(--secondary);
            border-color: var(--secondary);
            color: #fff;
        }

        /* Step nav items (Sidebar) */
        .step-nav-item {
            background-color: var(--background);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            width: 100%;
        }
        .step-nav-item:hover {
            border-color: var(--primary);
            background-color: var(--muted);
            transform: translateY(-2px);
        }
        .step-nav-item.active {
            border-color: var(--primary);
            background-color: #EFF6FF;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.08);
        }
        .step-nav-item.active .step-nav-name {
            color: var(--primary);
            font-weight: 700;
        }
        .step-nav-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .step-nav-num {
            font-size: 0.75rem;
            text-transform: uppercase;
            font-weight: 700;
            color: var(--muted-foreground);
            letter-spacing: 0.05em;
        }
        .step-nav-name {
            font-size: 0.9375rem;
            font-weight: 600;
            color: var(--foreground);
        }
        .step-nav-status {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            font-size: 0.75rem;
            flex-shrink: 0;
            margin-left: 12px;
            font-weight: 700;
        }
        .step-nav-status.completed {
            background-color: #D1FAE5;
            color: #065F46;
        }
        .step-nav-status.pending_review {
            background-color: #FEF3C7;
            color: #92400E;
        }
        .step-nav-status.open {
            background-color: #DBEAFE;
            color: #1E40AF;
        }
        .step-nav-status.locked {
            background-color: var(--muted);
            color: var(--muted-foreground);
        }

        /* Step cards (Timeline) */
        .step-timeline {
            display: flex;
            flex-direction: column;
            gap: 24px;
            margin-top: 24px;
        }
        .step-card {
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            background-color: var(--background);
            padding: 24px;
            position: relative;
            transition: all 0.2s ease;
        }
        .step-card.locked {
            opacity: 0.6;
            background-color: #FAFAFA;
        }
        .step-card.completed {
            border-left: 4px solid var(--secondary);
        }
        .step-card.pending_review {
            border-left: 4px solid var(--accent);
        }
        .step-card.open {
            border-left: 4px solid var(--primary);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.05);
        }
        .step-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .step-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0;
        }
        .step-desc {
            font-size: 0.875rem;
            color: var(--muted-foreground);
            margin: 0 0 20px 0;
        }
        
        /* Field layouts inside steps */
        .fields-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-top: 1px solid var(--border);
            padding-top: 16px;
        }
        .field-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 12px;
            background-color: #F8FAFC;
            border-radius: var(--radius-md);
        }
        .field-label {
            font-weight: 600;
            font-size: 0.875rem;
        }
        .field-input-group {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-top: 4px;
        }
        .field-value-display {
            font-size: 0.875rem;
            color: var(--foreground);
            background: #EFF6FF;
            padding: 6px 12px;
            border-radius: var(--radius-md);
            border: 1px solid #BFDBFE;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .file-upload-input {
            font-size: 0.8125rem;
        }
        .history-box {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px dashed var(--border);
        }
        .history-title {
            font-size: 0.875rem;
            font-weight: 700;
            text-transform: uppercase;
            color: var(--muted-foreground);
            margin-bottom: 12px;
        }
        .history-item {
            font-size: 0.8125rem;
            padding: 6px 12px;
            border-left: 2px solid var(--border);
            margin-bottom: 8px;
            background: #F9FAFB;
        }
        /* Admin action panel button layout */
        .admin-action-buttons {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .admin-note-btn {
            background-color: white;
            border: 1px solid #9333EA;
            color: #9333EA;
            font-size: 0.875rem;
            padding: 12px 24px;
            margin-right: auto;
        }
        .admin-action-primary {
            display: flex;
            gap: 12px;
            align-items: center;
        }
        .admin-action-primary .btn {
            font-size: 0.875rem;
            padding: 12px 24px;
            min-width: 120px;
        }

        @media (max-width: 768px) {
            .mobile-topbar { display: flex; }
            .sidebar {
                transform: translateX(-100%);
                width: min(280px, 85vw);
                min-width: unset;
                padding: 64px 20px 24px 20px;
                box-shadow: 4px 0 24px rgba(0,0,0,0.12);
            }
            .sidebar.open { transform: translateX(0); }
            .sidebar-brand p { display: none; }
            .sidebar-brand h1 { display: none; }
            .workspace {
                margin-left: 0 !important;
                padding: 72px 16px 32px 16px;
                width: 100%;
                min-width: 0;
                max-width: 100vw;
                box-sizing: border-box;
            }
            h2 { font-size: 1.5rem; }
            .section-desc { font-size: 0.875rem; }
            /* Ensure nothing wider than viewport */
            .card, .table-container, .process-workspace, .subtab-bar, #filters-container {
                max-width: 100%;
                box-sizing: border-box;
            }
            /* Process details: step sidebar as full-width accordion on mobile */
            .process-workspace {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }
            .process-sidebar { width: 100%; }
            .step-stages-toggle {
                display: flex;
                align-items: center;
                justify-content: space-between;
                background: var(--background);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 14px 16px;
                font-weight: 700;
                font-size: 0.9375rem;
                cursor: pointer;
                width: 100%;
                margin-bottom: 8px;
            }
            .process-sidebar-steps {
                display: none;
            }
            .process-sidebar-steps.expanded {
                display: flex;
                flex-direction: column;
                gap: 8px;
            }
            /* Process list: transform table into vertical cards on mobile */
            #screen-list .table-container {
                overflow: visible;
                background: transparent;
                max-height: none;
                border-radius: 0;
            }
            #screen-list table { display: block; min-width: unset; width: 100%; }
            #screen-list thead { display: none; }
            #screen-list tbody { display: flex; flex-direction: column; gap: 10px; }
            #screen-list tr {
                display: flex;
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
                background: var(--background);
                border: 1px solid var(--border);
                border-radius: var(--radius-lg);
                padding: 14px 16px;
            }
            #screen-list tr:hover { background: #F9FAFB; }
            #screen-list td {
                display: block;
                border: none;
                padding: 0;
                font-size: 0.875rem;
                width: 100%;
            }
            /* Process title fits full width */
            #screen-list .process-title {
                font-size: 0.9375rem;
                max-width: 100%;
                -webkit-line-clamp: 2;
            }
            /* Content panel: constrained to parent width — page scrolls */
            .process-content-panel {
                width: 100%;
                min-width: 0;
                box-sizing: border-box;
                overflow: hidden;
                padding: 20px 16px;
            }
            /* Details header: tighter on mobile */
            #screen-details > div:first-child h2 {
                font-size: 1.25rem;
            }
            /* Mobile step pill bar — same pattern as the working document filter bar */
            .mobile-step-pill-bar {
                display: flex !important;
                overflow-x: auto;
                width: 100%;
                min-width: 0;
                gap: 8px;
                padding-bottom: 8px;
                margin-bottom: 12px;
                -webkit-overflow-scrolling: touch;
            }
            .mobile-step-pill-bar::-webkit-scrollbar { display: none; }
            /* Admin action panel: stack buttons vertically on mobile */
            .admin-action-buttons {
                flex-direction: column;
                align-items: stretch;
            }
            .admin-note-btn {
                margin-right: 0;
                width: 100%;
                text-align: center;
            }
            .admin-action-primary {
                flex-direction: row;
                width: 100%;
            }
            .admin-action-primary .btn {
                flex: 1;
                min-width: 0;
                text-align: center;
            }
            /* Hide the desktop sidebar wrapper on mobile */
            #details-sidebar-target-wrapper { display: none !important; }
        }
        @media (min-width: 769px) {
            .step-stages-toggle { display: none !important; }
            .process-sidebar-steps { display: flex; flex-direction: column; gap: 12px; }
            .mobile-step-pill-bar { display: none !important; }
        }
        @media (max-width: 992px) and (min-width: 769px) {
            .process-workspace {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
                gap: 24px;
            }
            .process-sidebar { width: 100%; }
            .process-content-panel { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="bg-shape-top-right"></div>

    <!-- Mobile Top Bar -->
    <div class="mobile-topbar" id="mobile-topbar">
        <span class="mobile-topbar-brand" id="mobile-brand-label">Vistas</span>
        <button class="hamburger-btn" id="hamburger-btn" onclick="toggleSidebar()" aria-label="Open menu">
            <span></span><span></span><span></span>
        </button>
    </div>
    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

    <div class="layout-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-brand" id="sidebar-brand-container">
                <!-- Dynamically populated based on user role, including the Log Out button -->
            </div>
        </aside>

        <main class="workspace">
            <!-- LIST VIEW SCREEN -->
            <section id="screen-list">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px;">
                    <div>
                        <h2>Processes</h2>
                        <p class="section-desc" style="margin-bottom: 0;" id="processes-section-desc">Manage Your Processes</p>
                    </div>
                    <button class="btn" id="start-process-btn" onclick="openStartProcessModal()">Start New Process</button>
                </div>

                <div class="subtab-bar" id="process-subtab-bar" style="display: none;">
                    <button class="subtab-btn active" id="tab-btn-admin-review" onclick="switchProcessTab('ADMIN_REVIEW_REQUIRED')">Admin Review Required</button>
                    <button class="subtab-btn" id="tab-btn-user-input" onclick="switchProcessTab('USER_INPUT_REQUIRED')">User Input Required</button>
                    <button class="subtab-btn" id="tab-btn-completed" onclick="switchProcessTab('COMPLETED')">Completed</button>
                </div>

                <div id="filters-container" style="display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap;">
                    <div class="form-group" style="margin-bottom: 0; flex-grow: 1; min-width: 200px;">
                        <label for="filter-search">Search Process / ID</label>
                        <input type="text" id="filter-search" placeholder="Search by Process name or ID..." oninput="filterProcesses()">
                    </div>
                    <div class="form-group" id="admin-flat-filter-group" style="display: none; margin-bottom: 0; flex-grow: 1; min-width: 200px;">
                        <label for="filter-flat">Filter by Flat</label>
                        <input type="text" id="filter-flat" placeholder="e.g. K-0302" oninput="filterProcesses()">
                    </div>
                    <div class="form-group" id="admin-email-filter-group" style="display: none; margin-bottom: 0; flex-grow: 1; min-width: 200px;">
                        <label for="filter-email">Filter by Email</label>
                        <input type="text" id="filter-email" placeholder="e.g. resident@vistas.com" oninput="filterProcesses()">
                    </div>
                </div>

                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Process Name</th>
                                <th class="process-table-col-flat">Flat</th>
                                <th>State</th>
                                <th class="process-table-col-date">Started On</th>
                            </tr>
                        </thead>
                        <tbody id="process-rows-target">
                            <tr>
                                <td colspan="5" style="text-align: center; color: var(--muted-foreground); padding: 40px; font-weight: 500;">
                                    Loading workflows...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- DETAILS VIEW SCREEN -->
            <section id="screen-details" style="display: none;">
                <!-- Process Header -->
                <div style="margin-bottom: 24px;">
                    <button class="btn btn-secondary" onclick="showProcessListScreen()" style="margin-bottom: 12px; font-size: 0.875rem; padding: 8px 14px;">
                        &larr; Back
                    </button>
                    <h2 id="details-process-title" style="margin-bottom: 8px; font-size: 1.625rem; line-height: 1.2;">Process Details</h2>
                    <!-- Meta chips row: flat, ID, status -->
                    <div id="details-process-meta" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
                        <!-- Populated dynamically -->
                    </div>
                </div>

                <div class="process-workspace">
                    <!-- Mobile step pill bar (always visible on mobile, hidden on desktop) -->
                    <div class="mobile-step-pill-bar" id="mobile-step-pill-bar">
                        <!-- Populated dynamically by JS -->
                    </div>

                    <!-- Step Navigation Sidebar (desktop only) -->
                    <div class="process-sidebar" id="details-sidebar-target-wrapper">
                        <!-- Steps list -->
                        <div class="process-sidebar-steps" id="details-sidebar-target">
                            <!-- Step list items will be rendered here -->
                        </div>
                    </div>

                    <!-- Selected Step Interaction Panel -->
                    <div class="process-content-panel" id="details-content-target">
                        <!-- Details of the selected step will be rendered here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- START PROCESS MODAL -->
    <div class="modal-overlay" id="start-process-modal">
        <div class="modal-content">
            <button class="close-modal-btn" onclick="closeStartProcessModal()">&times;</button>
            <h3 style="margin-top: 0; font-size: 1.5rem; font-weight: 800; margin-bottom: 24px;">Start New Process</h3>
            <form id="start-process-form" onsubmit="handleStartProcess(event)">
                <div class="form-group">
                    <label for="select-process-template">Process Type</label>
                    <select id="select-process-template" required>
                        <option value="tenant_onboarding_v1">Tenant Onboarding Process</option>
                    </select>
                </div>
                <div class="form-group" id="flat-select-group" style="display: none;">
                    <label for="select-process-flat">Select Flat</label>
                    <select id="select-process-flat">
                        <!-- Options populated dynamically -->
                    </select>
                </div>
                <div id="start-process-status" style="margin-top: 12px; font-size: 0.875rem; font-weight: 600;"></div>
                <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; margin-top: 24px;">
                    <button type="button" class="btn btn-secondary" onclick="closeStartProcessModal()">Cancel</button>
                    <button type="submit" class="btn" id="start-process-submit-btn">Start</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Baked in per-route at build time (see frontend/src/views/process.rs::process_html).
        // /process always renders false (your own process, full stop); /admin-process
        // always renders true (the reviewer/auditor queue). No client-side guessing.
        const IS_ADMIN_PROCESS_PAGE = false;

        // Broad "has some admin capability" — used only for sidebar branding/nav links.
        function isAdminUser(user) {
            return !!(user && (
                user.can_view_users || user.can_manage_users ||
                user.can_manage_documents || user.can_manage_roles ||
                user.can_manage_designations || user.can_manage_categories ||
                user.can_review_process || user.can_view_roles || user.can_view_all_processes
            ));
        }

        // Whether this user reviews OTHER people's process steps (write access: approve,
        // reject, upload as admin, edit admin-role fields). Only ever relevant/rendered
        // on the /admin-process page — the personal page never shows these regardless.
        function canReviewProcess(user) {
            return IS_ADMIN_PROCESS_PAGE && !!(user && user.can_review_process);
        }

        // Access gate for /admin-process itself — reviewers and the read-only process.view
        // auditor role may enter; everyone else gets bounced to the personal /process page.
        function canAccessAdminProcessPage(user) {
            return !!(user && user.can_view_all_processes);
        }

        const API_BASE = "";
        let token = localStorage.getItem('vfs_token');
        let user = JSON.parse(localStorage.getItem('vfs_user') || 'null');
        let allProcesses = [];
        let currentTab = 'ADMIN_REVIEW_REQUIRED';
        let userFlats = [];
        let currentProcessDetails = null;
        let currentSelectedStepId = null;

        // ---- Sidebar toggle (mobile) ----
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            if (sidebar.classList.contains('open')) {
                closeSidebar();
            } else {
                sidebar.classList.add('open');
                overlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }
        }
        function closeSidebar() {
            const sidebar = document.getElementById('sidebar');
            const overlay = document.getElementById('sidebar-overlay');
            sidebar.classList.remove('open');
            overlay.classList.remove('open');
            document.body.style.overflow = '';
        }

        // ---- Process step sidebar mobile accordion ----
        let stagesExpanded = false;
        function toggleStagesSidebar() {
            stagesExpanded = !stagesExpanded;
            const panel = document.getElementById('details-sidebar-target');
            const icon = document.getElementById('stages-toggle-icon');
            const label = document.getElementById('stages-toggle-label');
            if (stagesExpanded) {
                panel.classList.add('expanded');
                icon.textContent = '▲';
                label.textContent = 'Hide Stages';
            } else {
                panel.classList.remove('expanded');
                icon.textContent = '▼';
                label.textContent = 'View All Stages';
            }
        }

        // Redirect if not logged in
        if (!token || !user) {
            window.location.href = '/login';
        } else if (IS_ADMIN_PROCESS_PAGE && !canAccessAdminProcessPage(user)) {
            // Not a reviewer or auditor — nothing on this page applies to them.
            window.location.href = '/process';
        }

        // Starting a process is a personal-page action — doesn't belong on the oversight queue.
        if (IS_ADMIN_PROCESS_PAGE) {
            const startProcessBtn = document.getElementById('start-process-btn');
            if (startProcessBtn) startProcessBtn.style.display = 'none';
            const sectionDesc = document.getElementById('processes-section-desc');
            if (sectionDesc) sectionDesc.textContent = 'Review resident processes';
        }

        // Populate sidebar based on which PAGE this is, not on the viewer's permissions.
        // The full "Admin" re-branding (header, Residents/Documents/Roles links) only
        // ever applies on /admin-process — that page IS an admin tool. The personal
        // /process page always stays "Vistas / Resident Portal", even for admin-capable
        // hybrid users, exactly like /dashboard: it just adds an "Admin Dashboard" cross-link.
        const isAdmin = isAdminUser(user);
        const showAdminBranding = IS_ADMIN_PROCESS_PAGE;
        const sidebarBrandContainer = document.getElementById('sidebar-brand-container');
        // Set mobile brand label
        const mobileBrandLabel = document.getElementById('mobile-brand-label');
        if (mobileBrandLabel) mobileBrandLabel.textContent = showAdminBranding ? 'Admin' : 'Vistas';
        if (sidebarBrandContainer) {
            const logoutOnClick = `localStorage.removeItem('vfs_token'); localStorage.removeItem('vfs_user'); window.location.href='/login';`;
            if (showAdminBranding) {
                const canManageRoles = !!(user && (user.can_manage_roles || user.can_manage_designations));
                const residentsLink = (user && user.can_view_users)
                    ? `<a href="/admin?tab=residents" class="nav-item" style="text-decoration: none;" onclick="closeSidebar()">Residents</a>`
                    : '';
                const documentsLink = (user && (user.can_manage_documents || user.can_manage_categories))
                    ? `<a href="/admin?tab=documents" class="nav-item" style="text-decoration: none;" onclick="closeSidebar()">Documents</a>`
                    : '';
                const rolesLink = canManageRoles
                    ? `<a href="/admin?tab=roles" class="nav-item" style="text-decoration: none;" onclick="closeSidebar()">Roles</a>`
                    : '';
                const hasFlat = !!(user && user.wing !== 'TBD' && user.flat_number !== 'TBD');
                const myFlatDashboardLink = hasFlat
                    ? `<a href="/dashboard" class="admin-btn">My Flat Dashboard &rarr;</a>`
                    : '';
                // The self link always points at whichever process page is actually loaded.
                const processesLink = IS_ADMIN_PROCESS_PAGE
                    ? `<a href="/admin-process" class="nav-item active" style="text-decoration: none;" onclick="closeSidebar()">Process Review</a>`
                    : `<a href="/process" class="nav-item active" style="text-decoration: none;" onclick="closeSidebar()">Processes</a>`;
                // Cross-link from the personal page to the admin review queue only.
                // No reverse link — the admin review queue is an admin tool, not a place
                // to bounce back to a personal process from.
                const otherProcessLink = !IS_ADMIN_PROCESS_PAGE && canAccessAdminProcessPage(user)
                    ? `<a href="/admin-process" class="nav-item" style="text-decoration: none;" onclick="closeSidebar()">Process Review</a>`
                    : '';
                sidebarBrandContainer.innerHTML = `
                    <h1>Admin</h1>
                    <p>Raheja Vistas Admin Room</p>
                    <nav class="nav-menu">
                        ${residentsLink}
                        ${documentsLink}
                        ${rolesLink}
                        ${processesLink}
                        ${otherProcessLink}
                        ${myFlatDashboardLink}
                        <button class="logout-btn" style="margin-top:8px;" onclick="${logoutOnClick}">Log Out</button>
                    </nav>
                `;
            } else {
                // Personal /process page: always the resident shell, even for admin-capable
                // hybrid users — matches /dashboard's "Admin Dashboard" cross-link pattern
                // rather than re-branding the whole sidebar into admin mode.
                const adminDashboardLink = isAdmin
                    ? `<a href="/admin" class="admin-btn" style="text-decoration: none;">Admin Dashboard &rarr;</a>`
                    : '';
                sidebarBrandContainer.innerHTML = `
                    <h1>Vistas</h1>
                    <p>Resident Portal</p>
                    <nav class="nav-menu">
                        <a href="/dashboard" class="nav-item" style="text-decoration: none;" onclick="closeSidebar()">Profile</a>
                        <a href="/dashboard?tab=documents" class="nav-item" style="text-decoration: none;" onclick="closeSidebar()">Documents</a>
                        <a href="/process" class="nav-item active" style="text-decoration: none;" onclick="closeSidebar()">Processes</a>
                        ${adminDashboardLink}
                        <button class="logout-btn" style="margin-top:8px;" onclick="${logoutOnClick}">Log Out</button>
                    </nav>
                `;
            }
        }

        // Escapes HTML values safely
        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // API error bodies are either a bare JSON string or a {message: "..."} object —
        // reading the raw response text directly would show the JSON quoting/escaping
        // to the user. This unwraps either shape down to a plain message.
        async function readErrorMessage(response) {
            const raw = await response.text();
            try {
                const parsed = JSON.parse(raw);
                if (typeof parsed === 'string') return parsed;
                if (parsed && typeof parsed.message === 'string') return parsed.message;
            } catch (e) {}
            return raw;
        }

        // Helper to format ISO dates to "05 Jan 2026, 04:10PM" format
        function formatDateMinimal(isoStr) {
            if (!isoStr) return '';
            try {
                const date = new Date(isoStr);
                const day = String(date.getDate()).padStart(2, '0');
                const month = date.toLocaleDateString('en-US', { month: 'short' });
                const year = date.getFullYear();
                
                let hours = date.getHours();
                const minutes = String(date.getMinutes()).padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12;
                const hourStr = String(hours).padStart(2, '0');
                
                return `${day} ${month} ${year}, ${hourStr}:${minutes}${ampm}`;
            } catch(e) {
                return isoStr;
            }
        }

        function formatDate(isoStr) {
            return formatDateMinimal(isoStr);
        }

        // Switch between tabs
        function switchProcessTab(tab) {
            currentTab = tab;
            document.getElementById('tab-btn-admin-review').className = 'subtab-btn' + (tab === 'ADMIN_REVIEW_REQUIRED' ? ' active' : '');
            document.getElementById('tab-btn-user-input').className = 'subtab-btn' + (tab === 'USER_INPUT_REQUIRED' ? ' active' : '');
            document.getElementById('tab-btn-completed').className = 'subtab-btn' + (tab === 'COMPLETED' ? ' active' : '');
            renderProcessList();
        }

        // Load process list from backend
        async function loadProcesses() {
            if (IS_ADMIN_PROCESS_PAGE) {
                const adminEmailGroup = document.getElementById('admin-email-filter-group');
                if (adminEmailGroup) adminEmailGroup.style.display = 'flex';
                const adminFlatGroup = document.getElementById('admin-flat-filter-group');
                if (adminFlatGroup) adminFlatGroup.style.display = 'flex';
                const processSubtabBar = document.getElementById('process-subtab-bar');
                if (processSubtabBar) processSubtabBar.style.display = 'flex';
                currentTab = 'ADMIN_REVIEW_REQUIRED';
            } else {
                currentTab = 'ALL';
            }
            try {
                const response = await fetch(`${API_BASE}/api/v1/process/list`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ personal_only: !IS_ADMIN_PROCESS_PAGE })
                });
                if (response.ok) {
                    const data = await response.json();
                    allProcesses = data.processes;
                    userFlats = data.flats;
                    renderProcessList();
                } else if (response.status === 401) {
                    window.location.href = '/login';
                } else {
                    const errText = await readErrorMessage(response);
                    document.getElementById('process-rows-target').innerHTML = `
                        <tr>
                            <td colspan="5" style="text-align: center; color: var(--danger); padding: 40px; font-weight: 500;">
                                Failed to load processes: ${escapeHtml(errText)}
                            </td>
                        </tr>
                    `;
                }
            } catch(e) {
                console.error(e);
                document.getElementById('process-rows-target').innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--danger); padding: 40px; font-weight: 500;">
                            Network error while loading processes.
                        </td>
                    </tr>
                `;
            }
        }

        // Apply input filters on input change
        function filterProcesses() {
            renderProcessList();
        }

        // Render processes in table
        function renderProcessList() {
            const tbody = document.getElementById('process-rows-target');
            tbody.innerHTML = '';

            const searchQuery = document.getElementById('filter-search').value.trim().toLowerCase();
            const flatQuery = document.getElementById('filter-flat').value.trim().toLowerCase();
            const emailQuery = document.getElementById('filter-email').value.trim().toLowerCase();
            const isAdmin = IS_ADMIN_PROCESS_PAGE;

            // Sort by creation date descending (oldest one should be below)
            allProcesses.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));

            const filtered = allProcesses.filter(p => {
                // Use the backend-provided status to determine if user or admin action is required
                const isUserAction = p.status === 'USER_INPUT_REQUIRED';
                const isCompleted = p.status === 'COMPLETED';
                
                if (isAdmin) {
                    if (currentTab === 'USER_INPUT_REQUIRED' && !isUserAction) return false;
                    if (currentTab === 'ADMIN_REVIEW_REQUIRED' && p.status !== 'ADMIN_REVIEW_REQUIRED') return false;
                    if (currentTab === 'COMPLETED' && !isCompleted) return false;
                } else {
                    // Resident sees all processes, we don't hide completed ones anymore.
                }

                // 1. Search Query (Process Name, Template ID, or Process ID)
                if (searchQuery) {
                    const templateName = p.template_id === 'tenant_onboarding_v1' ? 'Tenant Onboarding Process' : p.template_id;
                    const matchesName = templateName.toLowerCase().includes(searchQuery);
                    const matchesId = p.process_id.toLowerCase().includes(searchQuery);
                    if (!matchesName && !matchesId) {
                        return false;
                    }
                }

                // 2. Flat Query
                if (flatQuery && (!p.flat_label || !p.flat_label.toLowerCase().includes(flatQuery))) {
                    return false;
                }

                // 3. Email Query (Admin-only filter)
                if (isAdmin && emailQuery && (!p.user_email || !p.user_email.toLowerCase().includes(emailQuery))) {
                    return false;
                }

                return true;
            });

            if (filtered.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" style="text-align: center; color: var(--muted-foreground); padding: 40px; font-weight: 500;">
                            No processes found.
                        </td>
                    </tr>
                `;
                return;
            }

            filtered.forEach(p => {
                const tr = document.createElement('tr');
                let stateText = "User Input Required";
                if (p.status === 'ADMIN_REVIEW_REQUIRED') stateText = "Admin Review Required";
                if (p.status === 'COMPLETED') stateText = "Completed";
                
                tr.innerHTML = `
                    <td>
                        <div class="process-title" onclick="viewProcessDetail('${p.process_id}')">
                            ${p.template_id === 'tenant_onboarding_v1' ? 'Tenant Onboarding Process' : escapeHtml(p.template_id)}
                        </div>
                        <div style="font-size: 0.75rem; color: var(--muted-foreground); margin-top: 4px;">
                            ID: ${p.process_id.substring(0, 8)} ${isAdmin ? `(${escapeHtml(p.user_email)})` : ''}
                        </div>
                    </td>
                    <td>
                        <strong>${p.flat_label ? escapeHtml(p.flat_label) : 'TBD'}</strong>
                    </td>
                    <td>
                        <span style="font-size: 0.8125rem; font-weight: 600; color: var(--primary);">${stateText}</span>
                    </td>
                    <td>
                        ${formatDate(p.created_at)}
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        // Open Modal to start process
        async function openStartProcessModal() {
            const statusEl = document.getElementById('start-process-status');
            const flatGroup = document.getElementById('flat-select-group');
            const flatSelect = document.getElementById('select-process-flat');
            statusEl.textContent = '';
            
            document.getElementById('start-process-modal').style.display = 'flex';

            // Admins cannot start a process for themselves
            if (canReviewProcess(user)) {
                statusEl.style.color = 'var(--danger)';
                statusEl.textContent = 'Administrative accounts cannot initiate processes directly. Please use the resident view.';
                document.getElementById('start-process-submit-btn').disabled = true;
                return;
            }

            document.getElementById('start-process-submit-btn').disabled = false;

            // Populate from preloaded userFlats
            flatSelect.innerHTML = '';
            if (userFlats.length > 1) {
                flatGroup.style.display = 'block';
                userFlats.forEach(f => {
                    const opt = document.createElement('option');
                    opt.value = f.flat_id;
                    opt.textContent = `${escapeHtml(f.wing)}-${escapeHtml(f.flat_number)}`;
                    flatSelect.appendChild(opt);
                });
            } else {
                flatGroup.style.display = 'none';
            }
        }

        function closeStartProcessModal() {
            document.getElementById('start-process-modal').style.display = 'none';
            document.getElementById('start-process-form').reset();
        }

        // Handle process creation
        async function handleStartProcess(e) {
            e.preventDefault();
            const templateId = document.getElementById('select-process-template').value;
            const flatSelect = document.getElementById('select-process-flat');
            const flatGroup = document.getElementById('flat-select-group');
            const statusEl = document.getElementById('start-process-status');
            const submitBtn = document.getElementById('start-process-submit-btn');

            let flatId = null;
            if (flatGroup.style.display === 'block' && flatSelect.value) {
                flatId = parseInt(flatSelect.value, 10);
            } else if (userFlats.length === 1) {
                flatId = userFlats[0].flat_id;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Starting...';
            statusEl.textContent = '';

            try {
                const payload = {
                    template_id: templateId,
                    flat_id: flatId,
                    personal_only: true
                };

                const response = await fetch(`${API_BASE}/api/v1/process/state`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    const data = await response.json();
                    closeStartProcessModal();
                    await loadProcesses();
                    viewProcessDetail(data.process_id);
                } else {
                    const errText = await readErrorMessage(response);
                    statusEl.style.color = 'var(--danger)';
                    statusEl.textContent = `Failed to start process: ${errText}`;
                }
            } catch(e) {
                statusEl.style.color = 'var(--danger)';
                statusEl.textContent = 'Connection error.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Start';
            }
        }

        // Toggle Screen
        function showProcessListScreen() {
            document.getElementById('screen-list').style.display = 'block';
            document.getElementById('screen-details').style.display = 'none';
            const menuBtn = document.getElementById('menu-btn-list');
            if (menuBtn) menuBtn.classList.add('active');
        }

        function showProcessDetailsScreen() {
            document.getElementById('screen-list').style.display = 'none';
            document.getElementById('screen-details').style.display = 'block';
            const menuBtn = document.getElementById('menu-btn-list');
            if (menuBtn) menuBtn.classList.remove('active');
        }

        // View single process details
        async function viewProcessDetail(processId) {
            showProcessDetailsScreen();
            
            document.getElementById('details-process-title').textContent = 'Loading Workflow...';
            document.getElementById('details-process-meta').innerHTML = '';
            document.getElementById('details-sidebar-target').innerHTML = `
                <div style="text-align: center; color: var(--muted-foreground); padding: 12px; font-size: 0.875rem;">
                    Loading stages...
                </div>
            `;
            document.getElementById('details-content-target').innerHTML = `
                <div style="text-align: center; color: var(--muted-foreground); padding: 40px;">
                    Retrieving workflow details...
                </div>
            `;

            try {
                const response = await fetch(`${API_BASE}/api/v1/process/state`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ process_id: processId, personal_only: !IS_ADMIN_PROCESS_PAGE })
                });

                if (response.ok) {
                    currentProcessDetails = await response.json();
                    renderProcessDetails();
                } else {
                    const errText = await readErrorMessage(response);
                    document.getElementById('details-process-title').textContent = 'Error Loading Process';
                    document.getElementById('details-process-meta').innerHTML = `<span style="font-size:0.8125rem;color:#EF4444;">${escapeHtml(errText)}</span>`;
                    document.getElementById('details-sidebar-target').innerHTML = '';
                    document.getElementById('details-content-target').innerHTML = '';
                }
            } catch(e) {
                console.error(e);
                document.getElementById('details-process-title').textContent = 'Error Loading Process';
                document.getElementById('details-process-meta').innerHTML = '<span style="font-size:0.8125rem;color:#EF4444;">Connection error occurred.</span>';
                document.getElementById('details-sidebar-target').innerHTML = '';
                document.getElementById('details-content-target').innerHTML = '';
            }
        }

        // Render Process Details page
        function renderProcessDetails() {
            if (!currentProcessDetails) return;

            const p = currentProcessDetails;
            const metaContainer = document.getElementById('details-process-meta');

            // Title
            document.getElementById('details-process-title').textContent = p.process_name || p.template_id;

            // Meta chips (flat, ID, status)
            const statusChipClass = p.is_completed ? 'background:#D1FAE5;color:#065F46;' : 'background:#DBEAFE;color:#1E40AF;';
            const statusText = p.is_completed ? 'Completed' : 'In Progress';
            metaContainer.innerHTML = `
                ${p.flat_label ? `<span style="display:inline-flex;align-items:center;gap:5px;background:var(--muted);color:var(--muted-foreground);font-size:0.75rem;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:0.04em;">Flat&nbsp;${escapeHtml(p.flat_label)}</span>` : ''}
                <span style="display:inline-flex;align-items:center;gap:5px;background:var(--muted);color:var(--muted-foreground);font-size:0.75rem;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:0.04em;">ID&nbsp;${p.process_id.substring(0, 8)}</span>
                <span style="display:inline-flex;align-items:center;gap:5px;${statusChipClass}font-size:0.75rem;font-weight:700;padding:4px 10px;border-radius:999px;text-transform:uppercase;letter-spacing:0.04em;">${statusText}</span>
            `;

            // Render steps in the sidebar
            const sidebar = document.getElementById('details-sidebar-target');
            sidebar.innerHTML = '';

            const steps = p.steps || [];
            if (steps.length === 0) {
                sidebar.innerHTML = '<div style="color: var(--muted-foreground); text-align: center; padding: 12px;">No stages available</div>';
                return;
            }

            // Set default selected step if not set or not in current list
            if (!currentSelectedStepId || !steps.some(s => s.template_step_id === currentSelectedStepId)) {
                // Find first OPEN or PENDING_REVIEW step, otherwise default to first step
                const activeStep = steps.find(s => s.status === 'OPEN' || s.status === 'PENDING_REVIEW');
                currentSelectedStepId = activeStep ? activeStep.template_step_id : steps[0].template_step_id;
            }

            steps.forEach((step, index) => {
                const isActive = step.template_step_id === currentSelectedStepId;
                
                let statusLabel = 'Locked';
                let statusSymbol = '○';
                if (step.status === 'COMPLETED') { statusLabel = 'Done'; statusSymbol = '✓'; }
                else if (step.status === 'PENDING_REVIEW') { statusLabel = 'Review'; statusSymbol = '⋯'; }
                else if (step.status === 'OPEN') { statusLabel = 'Active'; statusSymbol = '●'; }

                // Desktop sidebar nav item
                const btn = document.createElement('button');
                btn.className = 'step-nav-item' + (isActive ? ' active' : '');
                btn.onclick = () => selectStep(step.template_step_id);
                btn.innerHTML = `
                    <div class="step-nav-info">
                        <span class="step-nav-num">Stage ${index + 1}</span>
                        <span class="step-nav-name">${escapeHtml(step.name)}</span>
                    </div>
                    <span class="step-nav-status ${step.status.toLowerCase()}">${statusLabel}</span>
                `;
                sidebar.appendChild(btn);
            });

            // Mobile pill bar — always visible, horizontal scroll
            const pillBar = document.getElementById('mobile-step-pill-bar');
            if (pillBar) {
                pillBar.innerHTML = '';
                steps.forEach((step, index) => {
                    const isActive = step.template_step_id === currentSelectedStepId;
                    let pillStatusClass = step.status === 'COMPLETED' ? 'completed' : '';
                    let statusSymbol = '';
                    if (step.status === 'COMPLETED') statusSymbol = ' ✓';
                    else if (step.status === 'PENDING_REVIEW') statusSymbol = ' ⋯';
                    else if (step.status === 'OPEN') statusSymbol = ' ●';

                    const pill = document.createElement('button');
                    pill.className = 'mobile-step-pill' + (isActive ? ' active' : '') + (pillStatusClass ? ' ' + pillStatusClass : '');
                    pill.onclick = () => selectStep(step.template_step_id);
                    pill.textContent = `${index + 1}. ${step.name}${statusSymbol}`;
                    pillBar.appendChild(pill);
                });

                // JS drag scroll — works regardless of CSS/browser touch routing
                let tsX = 0, tsScroll = 0, tsDragging = false;
                pillBar.addEventListener('touchstart', (e) => {
                    tsX = e.touches[0].clientX;
                    tsScroll = pillBar.scrollLeft;
                    tsDragging = true;
                }, { passive: true });
                pillBar.addEventListener('touchmove', (e) => {
                    if (!tsDragging) return;
                    pillBar.scrollLeft = tsScroll + (tsX - e.touches[0].clientX);
                }, { passive: true });
                pillBar.addEventListener('touchend', () => { tsDragging = false; }, { passive: true });
            }

            // Render the currently selected step content in the content panel
            renderSelectedStepContent();
        }

        function selectStep(stepId) {
            currentSelectedStepId = stepId;
            // Auto-collapse stages on mobile after selection
            if (window.innerWidth <= 768) {
                stagesExpanded = false;
                const panel = document.getElementById('details-sidebar-target');
                const icon = document.getElementById('stages-toggle-icon');
                const label = document.getElementById('stages-toggle-label');
                if (panel) panel.classList.remove('expanded');
                if (icon) icon.textContent = '▼';
                if (label) label.textContent = 'View All Stages';
            }
            renderProcessDetails();
        }

        // Helper to render fields list for a step/substep
        function renderFieldsList(fields, stepStatus, stepId, parentStatus = null) {
            let html = '';
            const isCurrentAdmin = canReviewProcess(user);
            
            fields.forEach(f => {
                const fieldId = f.template_field_id;
                const filledBy = f.filled_by; // 'user' or 'admin'
                const type = f.type; // 'document' or 'text'
                const val = f.value || { text_value: null, document_id: null, document_title: null };

                let inputHtml = '';
                let isReadOnly = true;
                if (stepStatus === 'OPEN' || parentStatus === 'OPEN') {
                    // 'user' fields belong to the process author and are only ever
                    // editable from the resident-facing page (never the admin/oversight
                    // page — process.view holders land there too, and are read-only).
                    if (filledBy === 'user' && !IS_ADMIN_PROCESS_PAGE) {
                        isReadOnly = false;
                    } else if (filledBy === 'admin' && isCurrentAdmin) {
                        isReadOnly = false;
                    }
                }

                if (type === 'document') {
                    const history = f.history || [];
                    let allDocs = [];
                    if (val.document_id) allDocs.push({ document_id: val.document_id, document_title: val.document_title, updated_at: val.updated_at });
                    for (const h of history) {
                        if (h.document_id) allDocs.push(h);
                    }
                    
                    const uniqueDocs = [];
                    const seenIds = new Set();
                    for (const doc of allDocs) {
                        if (!seenIds.has(doc.document_id)) {
                            seenIds.add(doc.document_id);
                            uniqueDocs.push(doc);
                        }
                    }

                    if (uniqueDocs.length > 0) {
                        inputHtml = uniqueDocs.map(doc => `
                            <div class="field-value-display" style="padding: 10px 16px; border-radius: var(--radius-lg); font-size: 0.9375rem; margin-bottom: 8px; background-color: var(--background); border: 1px solid var(--border); display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-width: 0; box-sizing: border-box;">
                                <span style="font-weight: 600; flex: 1; min-width: 0; overflow-wrap: break-word; word-break: break-all;">Document: ${escapeHtml(doc.document_title || 'File')}</span>
                                <button type="button" class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.75rem; flex-shrink: 0;" onclick="downloadProcessDoc('${escapeHtml(doc.document_id)}')">Download</button>
                            </div>
                        `).join('');
                    } else {
                        inputHtml = `<span style="font-size: 0.875rem; color: var(--muted-foreground); font-style: italic; display: block; margin-bottom: 8px;">No document uploaded yet</span>`;
                    }

                    if (!isReadOnly) {
                        inputHtml += `
                            <div class="field-input-group" style="margin-top: 12px; display: flex; align-items: center; gap: 12px;">
                                <button type="button" class="btn btn-secondary" onclick="openDocumentPickerModal(${stepId}, ${fieldId})" style="font-size: 0.875rem; padding: 8px 16px;">Choose Document</button>
                                <span id="upload-progress-${fieldId}" style="font-size: 0.8125rem; font-weight: 700; color: var(--primary);"></span>
                            </div>
                        `;
                    }
                } else {
                    // text field
                    if (isReadOnly) {
                        inputHtml = `
                            <div class="field-value-display" style="background-color: var(--muted); border-color: var(--border); color: var(--foreground); padding: 10px 16px; border-radius: var(--radius-lg); font-size: 0.9375rem; display: block; min-height: 44px; width: 100%; max-width: 500px;">
                                ${val.text_value ? escapeHtml(val.text_value) : '<em style="color: var(--muted-foreground);">No remarks entered</em>'}
                            </div>
                        `;
                    } else {
                        inputHtml = `
                            <input type="text" id="text-input-${fieldId}" class="text-value-input" style="width: 100%; max-width: 500px; padding: 12px; border: 1px solid var(--border); border-radius: var(--radius-lg); font-size: 0.9375rem;" value="${escapeHtml(val.text_value || '')}" placeholder="Enter details...">
                        `;
                    }
                }

                // History removed as per request
                let historyHtml = '';

                let filledByHtml = '';
                if (filledBy === 'admin') {
                    filledByHtml = `<div style="font-size: 0.75rem; color: #b45309; margin-bottom: 10px; text-transform: uppercase; font-weight: 600;">To be completed by Admin</div>`;
                }

                html += `
                    <div class="field-row" style="padding: 16px; background-color: #F8FAFC; border-radius: var(--radius-lg); border: 1px solid var(--border); margin-bottom: 12px;">
                        <span class="field-label" style="font-size: 0.95rem; font-weight: 700; display: block; margin-bottom: 4px;">
                            ${escapeHtml(f.name)} ${f.is_optional ? '<span style="color: var(--muted-foreground); font-weight: normal; font-size: 0.8125rem;">(Optional)</span>' : ''}
                        </span>
                        ${filledByHtml}
                        <div style="margin-top: 6px; margin-bottom: 6px;">${inputHtml}</div>
                        ${historyHtml}
                    </div>
                `;
            });

            // Save button for this step
            const hasEditableTextFields = fields.some(f => {
                const isFUser = f.filled_by === 'user';
                return (isFUser && !IS_ADMIN_PROCESS_PAGE && f.type === 'text') || (!isFUser && isCurrentAdmin && f.type === 'text');
            });
            const canSave = (stepStatus === 'OPEN' || parentStatus === 'OPEN') && hasEditableTextFields;

            if (canSave) {
                html += `
                    <div style="display: flex; justify-content: flex-end; margin-top: 16px;">
                        <button class="btn" style="font-size: 0.875rem; padding: 12px 24px;" id="save-step-btn-${stepId}" onclick="saveStepFieldsSubmit(${stepId})">Save Remarks</button>
                    </div>
                `;
            }

            return html;
        }

        // Render the currently selected step content in the content panel
        function renderSelectedStepContent() {
            const p = currentProcessDetails;
            const contentPanel = document.getElementById('details-content-target');
            contentPanel.innerHTML = '';

            const selectedStep = p.steps.find(s => s.template_step_id === currentSelectedStepId);
            if (!selectedStep) {
                contentPanel.innerHTML = '<div style="color: var(--muted-foreground); text-align: center; padding: 40px;">Select a stage to view details.</div>';
                return;
            }

            const stepStatus = selectedStep.status; // LOCKED, OPEN, PENDING_REVIEW, COMPLETED
            const stepId = selectedStep.template_step_id;

            // Render header
            let statusBanner = '';
            if (stepStatus === 'LOCKED') {
                statusBanner = `
                    <div style="background-color: var(--muted); border: 1px solid var(--border); padding: 16px; border-radius: var(--radius-lg); margin-bottom: 24px; display: flex; align-items: center; gap: 12px;">
                        <div>
                            <strong style="color: var(--muted-foreground); font-size: 1rem; display: block;">Locked Stage</strong>
                            <span style="font-size: 0.875rem; color: var(--muted-foreground);">This stage will unlock automatically once the previous stages are completed and approved.</span>
                        </div>
                    </div>
                `;
            } else if (stepStatus === 'OPEN') {
                statusBanner = `
                    <div style="background-color: #EFF6FF; border: 1px solid #BFDBFE; padding: 16px; border-radius: var(--radius-lg); margin-bottom: 24px; display: flex; align-items: center; gap: 12px;">
                        <div>
                            <strong style="color: #1E40AF; font-size: 1rem; display: block;">Active Stage</strong>
                            <span style="font-size: 0.875rem; color: #1E40AF;">Please upload the required files or fill in the remarks below.</span>
                        </div>
                    </div>
                `;
            } else if (stepStatus === 'PENDING_REVIEW') {
                statusBanner = `
                    <div style="background-color: #FFFBEB; border: 1px solid #FDE68A; padding: 16px; border-radius: var(--radius-lg); margin-bottom: 24px; display: flex; align-items: center; gap: 12px;">
                        <div>
                            <strong style="color: #92400E; font-size: 1rem; display: block;">Under Review</strong>
                            <span style="font-size: 0.875rem; color: #92400E;">Admin is currently reviewing your submissions for this stage.</span>
                        </div>
                    </div>
                `;
            } else if (stepStatus === 'COMPLETED') {
                statusBanner = `
                    <div style="background-color: #ECFDF5; border: 1px solid #A7F3D0; padding: 16px; border-radius: var(--radius-lg); margin-bottom: 24px; display: flex; align-items: center; gap: 12px;">
                        <div>
                            <strong style="color: #065F46; font-size: 1rem; display: block;">Stage Approved</strong>
                            <span style="font-size: 0.875rem; color: #065F46;">This stage has been completed and approved by the administration.</span>
                        </div>
                    </div>
                `;
            }

            // Render ongoing reviews by admin for this step
            const stepReviewIds = [selectedStep.template_step_id];
            if (selectedStep.substeps) {
                selectedStep.substeps.forEach(sub => stepReviewIds.push(sub.template_step_id));
            }
            const relevantReviews = (p.reviews || []).filter(r => stepReviewIds.includes(r.template_step_id));

            let reviewsHtml = '';
            if (relevantReviews.length > 0) {

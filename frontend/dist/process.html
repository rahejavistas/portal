                const latestReview = relevantReviews.reduce((latest, current) => {
                    return (new Date(current.created_at) > new Date(latest.created_at)) ? current : latest;
                });
                const latestDateFormatted = formatDateMinimal(latestReview.created_at);
                const lastIsApproved = latestReview.is_approved;
                const summaryBg = lastIsApproved ? '#ECFDF5' : '#FEF3C7';
                const summaryColor = lastIsApproved ? '#065F46' : '#92400E';
                const summaryIcon = lastIsApproved ? '✓' : '↩';
                const summaryLabel = lastIsApproved ? 'Last review: Approved' : 'Last review: Revision required';

                reviewsHtml = `
                    <div style="margin-bottom: 20px;">
                        <button
                            id="toggle-history-btn"
                            onclick="toggleReviewHistory()"
                            style="width:100%; text-align:left; display:flex; align-items:center; justify-content:space-between; gap:12px; background:${summaryBg}; border:none; border-radius:var(--radius-lg); padding:12px 16px; cursor:pointer; transition:opacity 0.2s;"
                        >
                            <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap; min-width:0;">
                                <span style="font-size:1rem; font-weight:700; color:${summaryColor}; flex-shrink:0;">${summaryIcon} ${summaryLabel}</span>
                                <span style="font-size:0.8125rem; color:${summaryColor}; opacity:0.8; white-space:nowrap;">${latestDateFormatted}</span>
                            </div>
                            <span style="font-size:0.75rem; font-weight:700; color:${summaryColor}; white-space:nowrap; flex-shrink:0; background:rgba(0,0,0,0.06); padding:3px 8px; border-radius:999px;">
                                ${relevantReviews.length} review${relevantReviews.length > 1 ? 's' : ''} ▼
                            </span>
                        </button>
                        <div id="review-history-container" style="display:none; margin-top:8px; flex-direction:column; gap:8px;">
                `;
                relevantReviews.forEach(r => {
                    const isApp = r.is_approved;
                    const dateFormatted = formatDateMinimal(r.created_at);
                    const labelColor = isApp ? '#065F46' : '#991B1B';
                    const bgColor = isApp ? '#ECFDF5' : '#FEE2E2';
                    const borderLeftColor = isApp ? 'var(--secondary)' : 'var(--danger)';

                    reviewsHtml += `
                        <div style="background-color: ${bgColor}; border-left: 4px solid ${borderLeftColor}; padding: 14px 16px; border-radius: var(--radius-lg);">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px;">
                                <strong style="font-size: 0.875rem; color: ${labelColor};">
                                    ${isApp ? '✓ Approved' : '↩ Revision Required'}
                                </strong>
                                <span style="font-size: 0.75rem; color: var(--muted-foreground); font-weight: 600;">
                                    ${dateFormatted}
                                </span>
                            </div>
                            <p style="margin: 0; font-size: 0.875rem; color: var(--foreground); line-height: 1.5;">
                                ${r.notes ? escapeHtml(r.notes).replace(/\n/g, '<br>') : '<em style="color:var(--muted-foreground);">No comments provided</em>'}
                            </p>

                        </div>
                    `;
                });
                reviewsHtml += `
                        </div>
                    </div>
                `;
            }

            // -------------------------------------------------------------
            // NEW: Render standalone internal admin notes for this step
            // -------------------------------------------------------------
            let standaloneCommentsHtml = '';
            const stepAdminComments = (p.admin_comments || []).filter(c => c.template_step_id === stepId);
            if (stepAdminComments.length > 0) {
                standaloneCommentsHtml = `
                    <div style="margin-bottom: 24px;">
                        <h4 style="margin: 0 0 12px 0; font-size: 1rem; font-weight: 700; color: #581C87; display: flex; align-items: center; gap: 8px;">
                            <span>🔒</span> Internal Admin Notes
                        </h4>
                        <div style="display: flex; flex-direction: column; gap: 8px;">
                `;
                
                // Sort by created_at desc
                stepAdminComments.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                
                stepAdminComments.forEach(c => {
                    const dateFormatted = formatDateMinimal(c.created_at);
                    const author = c.admin_email ? escapeHtml(c.admin_email) : 'Admin';
                    standaloneCommentsHtml += `
                        <div style="background-color: #FAF5FF; border-left: 4px solid #9333EA; padding: 12px 16px; border-radius: var(--radius-lg);">
                            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; flex-wrap: wrap; gap: 6px;">
                                <strong style="font-size: 0.8125rem; color: #6B21A8;">
                                    ${author}
                                </strong>
                                <span style="font-size: 0.75rem; color: #9333EA; font-weight: 600;">
                                    ${dateFormatted}
                                </span>
                            </div>
                            <p style="margin: 0; font-size: 0.875rem; color: #581C87; line-height: 1.5;">
                                ${escapeHtml(c.comment).replace(/\n/g, '<br>')}
                            </p>
                        </div>
                    `;
                });
                standaloneCommentsHtml += `
                        </div>
                    </div>
                `;
            }

            let html = `
                <div style="margin-bottom: 24px;">
                    <h3 style="margin: 0 0 8px 0; font-size: 1.5rem; font-weight: 800; color: var(--foreground);">${escapeHtml(selectedStep.name)}</h3>
                    <p style="margin: 0; font-size: 1rem; color: var(--muted-foreground); line-height: 1.5;">${escapeHtml(selectedStep.description || '')}</p>
                </div>
                ${statusBanner}
                ${reviewsHtml}
                ${standaloneCommentsHtml}
            `;

            // If the selected step has fields directly, render them
            if (selectedStep.fields && selectedStep.fields.length > 0 && stepStatus !== 'LOCKED') {
                html += `<div class="fields-container" style="border-top: none; padding-top: 0; margin-bottom: 24px;">`;
                html += renderFieldsList(selectedStep.fields, stepStatus, stepId);
                html += `</div>`;
            }

            // If the selected step has substeps, render each substep card vertically
            if (selectedStep.substeps && selectedStep.substeps.length > 0) {
                html += `<div style="display: flex; flex-direction: column; gap: 24px; margin-top: 16px;">`;

                // Hoist admin context and latest-review flags so each substep card can render the checkbox
                const isAdminForSubsteps = canReviewProcess(user);
                const latestRevForCards = (p.reviews || []).reduce((latest, r) => {
                    if (!latest) return r;
                    return (new Date(r.created_at) > new Date(latest.created_at)) ? r : latest;
                }, null);
                const alreadyFlaggedIds = latestRevForCards && Array.isArray(latestRevForCards.flagged_step_ids)
                    ? latestRevForCards.flagged_step_ids
                    : [];

                    selectedStep.substeps.forEach(sub => {
                    const subStatus = sub.status;
                    const subId = sub.template_step_id;

                    // Check if this substep was flagged in the latest review
                    const latestRevForSub = (p.reviews || []).reduce((latest, r) => {
                        if (!latest) return r;
                        return (new Date(r.created_at) > new Date(latest.created_at)) ? r : latest;

                    const isFlaggedByAdmin = latestRevForSub &&
                        Array.isArray(latestRevForSub.flagged_step_ids) &&

                                            <input type="checkbox" class="substep-flag-cb" data-substep-id="${sub.template_step_id}" ${alreadyFlaggedIds.includes(sub.template_step_id) ? 'checked' : ''} style="width:13px;height:13px;accent-color:#92400E;flex-shrink:0;cursor:pointer;">
                                            ⚑ Flag

                                </div>
                            </div>
                            <p class="step-desc" style="margin-bottom: 16px; font-size: 0.875rem;">${escapeHtml(sub.description || '')}</p>

                    if (sub.fields && sub.fields.length > 0 && subStatus !== 'LOCKED') {
                        html += `<div class="fields-container" style="border-top: 1px solid var(--border); padding-top: 16px;">`;
                        html += renderFieldsList(sub.fields, subStatus, subId, stepStatus);

                    html += `</div>`;
                });

                html += `</div>`;
            }

            // Admin review logic moved above

            // Render admin action panel (Approve / Reject) if user is admin
            const isCurrentAdmin = canReviewProcess(user);
            if (isCurrentAdmin) {

        // Fetch presigned URL and download file
        async function downloadProcessDoc(documentId) {
            const processId = currentProcessDetails.process_id;

            // Open the tab synchronously (within the click's user-gesture window) so
            // browsers don't treat it as a blocked popup once the awaited fetch below
            // resolves — a blocked-popup notification bar is what was causing the
            // page to jump back to the top after downloading.
            const newTab = window.open('', '_blank');

            // Preserve scroll position in case anything below still disturbs it.
            const scrollY = window.scrollY;
            const contentPanel = document.getElementById('details-content-target');
            const contentScrollTop = contentPanel ? contentPanel.scrollTop : 0;
            const restoreScroll = () => {
                window.scrollTo(0, scrollY);
                if (contentPanel) contentPanel.scrollTop = contentScrollTop;
            };

            try {
                const response = await fetch(`${API_BASE}/api/v1/process/download-url`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        process_id: processId,
                        document_id: documentId
                    })
                });

                if (response.ok) {
                    const data = await response.json();
                    if (data.download_url) {
                        if (newTab) {
                            newTab.location = data.download_url;
                        } else {
                            window.open(data.download_url, '_blank');
                        }
                    } else {
                        if (newTab) newTab.close();
                        alert('Download URL not returned by server.');
                    }
                } else {
                    if (newTab) newTab.close();
                    const errText = await readErrorMessage(response);
                    alert(`Download failed: ${errText}`);
                }
            } catch(e) {
                if (newTab) newTab.close();
                console.error(e);
                alert('Connection error while retrieving file.');
            } finally {
                restoreScroll();
                setTimeout(restoreScroll, 50);
            }
        }

        // Upload a document for a process field (presigned URL flow)
        async function uploadFieldDocument(stepId, fieldId) {
            const fileInput = document.getElementById(`file-input-${fieldId}`);
            const progressEl = document.getElementById(`upload-progress-${fieldId}`);
            
            if (fileInput.files.length === 0) return;
            const file = fileInput.files[0];

            if (file.size > 10 * 1024 * 1024) {
                alert('File size must be under 10MB.');
                fileInput.value = '';
                return;
            }

            progressEl.style.color = 'var(--primary)';
            progressEl.textContent = 'Requesting upload URL...';

            const processId = currentProcessDetails.process_id;

            try {
                // Step 1: Get presigned PUT URL
                const isCurrentAdmin = canReviewProcess(user);
                const uploadEndpoint = isCurrentAdmin 
                    ? `${API_BASE}/api/v1/admin/process/upload-url`
                    : `${API_BASE}/api/v1/documents/upload-url`;
                
                const uploadBody = isCurrentAdmin 
                    ? {
                        process_id: processId,
                        title: file.name,
                        filename: file.name,
                        content_type: file.type || 'application/octet-stream'
                    }
                    : {
                        process_id: processId,
                        title: file.name,
                        filename: file.name,
                        content_type: file.type || 'application/octet-stream'
                    };

                const urlRes = await fetch(uploadEndpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(uploadBody)
                });

                if (!urlRes.ok) {
                    const errText = await readErrorMessage(urlRes);
                    progressEl.style.color = 'var(--danger)';
                    progressEl.textContent = 'Failed.';
                    alert(`Failed to get upload URL: ${errText}`);
                    return;
                }

                const { document_id, upload_url } = await urlRes.json();

                // Step 2: PUT directly to S3
                progressEl.textContent = 'Uploading to storage...';
                const putRes = await fetch(upload_url, {
                    method: 'PUT',
                    headers: { 'Content-Type': file.type || 'application/octet-stream' },
                    body: file
                });

                if (!putRes.ok) {
                    progressEl.style.color = 'var(--danger)';
                    progressEl.textContent = 'Upload failed.';
                    alert('Failed to upload file to storage.');
                    return;
                }

                // Step 3: Confirm upload
                progressEl.textContent = 'Confirming...';
                
                const confirmEndpoint = isCurrentAdmin
                    ? `${API_BASE}/api/v1/admin/documents/confirm-upload`
                    : `${API_BASE}/api/v1/documents/confirm-upload`;

                const confirmRes = await fetch(confirmEndpoint, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ document_id })
                });

                if (!confirmRes.ok) {
                    const errText = await readErrorMessage(confirmRes);
                    progressEl.style.color = 'var(--danger)';
                    progressEl.textContent = 'Confirmation failed.';
                    alert(`Confirmation failed: ${errText}`);
                    return;
                }

                // Step 4: Attach to field via save-step
                const payload = {
                    process_id: processId,
                    template_step_id: stepId,
                    fields: [{
                        template_field_id: fieldId,
                        text_value: null,
                        document_id: document_id
                    }]
                };

                const saveRes = await fetch(`${API_BASE}/api/v1/process/save-step`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (saveRes.ok) {
                    progressEl.style.color = 'var(--secondary)';
                    progressEl.textContent = 'Success!';
                    await viewProcessDetail(processId);
                } else {
                    const err = await readErrorMessage(saveRes);
                    progressEl.style.color = 'var(--danger)';
                    progressEl.textContent = 'Save failed.';
                    alert(`Failed to save step: ${err}`);
                }
            } catch(e) {
                console.error(e);
                progressEl.style.color = 'var(--danger)';
                progressEl.textContent = 'Error.';
                alert('Connection error during upload.');
            }
        }

        // Save step fields (mainly text inputs)
        async function saveStepFieldsSubmit(stepId) {
            const step = findStepInTree(currentProcessDetails.steps, stepId);
            if (!step) return;

            const fieldsPayload = [];
            let hasError = false;
            const isCurrentAdmin = canReviewProcess(user);

            step.fields.forEach(f => {
                const fieldId = f.template_field_id;
                const isFieldEditable = (f.filled_by === 'user' && !IS_ADMIN_PROCESS_PAGE) || (f.filled_by === 'admin' && isCurrentAdmin);
                
                if (isFieldEditable) {
                    if (f.type === 'text') {
                        const inputEl = document.getElementById(`text-input-${fieldId}`);
                        if (inputEl) {
                            const val = inputEl.value.trim();
                            if (!f.is_optional && !val) {
                                alert(`Field "${f.name}" is required.`);
                                hasError = true;
                                return;
                            }
                            fieldsPayload.push({
                                template_field_id: fieldId,
                                text_value: val ? val : null,
                                document_id: null
                            });
                        }
                    } else if (f.type === 'document') {
                        const existingDocId = f.value ? f.value.document_id : null;
                        fieldsPayload.push({
                            template_field_id: fieldId,
                            text_value: null,
                            document_id: existingDocId
                        });
                    }
                } else {
                    // Preserve non-editable fields' current values
                    const val = f.value || { text_value: null, document_id: null };
                    fieldsPayload.push({
                        template_field_id: fieldId,
                        text_value: val.text_value,
                        document_id: val.document_id
                    });
                }
            });

            if (hasError) return;

            const saveBtn = document.getElementById(`save-step-btn-${stepId}`);
            saveBtn.disabled = true;
            saveBtn.textContent = 'Saving...';

            const payload = {
                process_id: currentProcessDetails.process_id,
                template_step_id: stepId,
                fields: fieldsPayload
            };

            try {
                const response = await fetch(`${API_BASE}/api/v1/process/save-step`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert('Step inputs saved successfully!');
                    await viewProcessDetail(currentProcessDetails.process_id);
                } else {
                    const errText = await readErrorMessage(response);
                    alert(`Failed to save step inputs: ${errText}`);
                }
            } catch(e) {
                console.error(e);
                alert('Connection error while saving step.');
            } finally {
                saveBtn.disabled = false;
                saveBtn.textContent = 'Save Step Inputs';
            }
        }

        async function submitAdminReview(stepId, isApproved) {

            // Collect flagged substep IDs from checked checkboxes
            const flaggedStepIds = Array.from(

            const payload = {
                process_id: currentProcessDetails.process_id,
                template_step_id: stepId,
                is_approved: isApproved,
                notes: notes ? notes : null,
                flagged_step_ids: flaggedStepIds.length > 0 ? flaggedStepIds : null
            };

            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/process/review`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alert(`Step review submitted successfully: ${isApproved ? 'Approved' : 'Rejected'}`);
                    await viewProcessDetail(currentProcessDetails.process_id);

            const notesEl = document.getElementById(`review-notes-${stepId}`);

            if (!confirm('Are you sure you want to reopen this step? It will allow the resident to modify documents.')) {

            const payload = {
                process_id: currentProcessDetails.process_id,

                notes: notes ? notes : null

        // Recursive search for step in the templates tree
        function findStepInTree(stepsList, stepId) {
            for (let s of stepsList) {
                if (s.template_step_id === stepId) return s;
                if (s.substeps && s.substeps.length > 0) {
                    const found = findStepInTree(s.substeps, stepId);
                    if (found) return found;
                }
            }
            return null;
        }

            const container = document.getElementById('review-history-container');

                const uploadEndpoint = isCurrentAdmin 
                    ? `${API_BASE}/api/v1/admin/process/upload-url`
                    : `${API_BASE}/api/v1/documents/upload-url`;

                    const errText = await readErrorMessage(confirmRes);
                    alert('Upload confirmation failed: ' + errText);
                    if(progressEl) { progressEl.style.color = 'var(--danger)'; progressEl.textContent = 'Confirmation failed'; }
                    return;
                }

                // Step 4: Attach to field
                await attachDocumentToField(currentPickerStepId, currentPickerFieldId, document_id, progressEl);

            } catch (e) {
                console.error(e);
                alert('Connection error during upload.');
                if(progressEl) { progressEl.style.color = 'var(--danger)'; progressEl.textContent = 'Failed'; }
            }
        }

        async function selectExistingDocument(documentId) {
            document.getElementById('docPickerModal').style.display = 'none';
            const progressEl = document.getElementById(`upload-progress-${currentPickerFieldId}`);
            if(progressEl) progressEl.textContent = 'Linking...';
            await attachDocumentToField(currentPickerStepId, currentPickerFieldId, documentId, progressEl);
        }

        async function attachDocumentToField(stepId, fieldId, documentId, progressEl) {
            const payload = {
                process_id: currentProcessDetails.process_id,
                template_step_id: stepId,
                fields: [{
                    template_field_id: fieldId,
                    text_value: null,
                    document_id: documentId
                }]
            };
            try {
                const saveRes = await fetch(`${API_BASE}/api/v1/process/save-step`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                if (saveRes.ok) {
                    if(progressEl) { progressEl.style.color = 'var(--secondary)'; progressEl.textContent = 'Success!'; }
                    await viewProcessDetail(currentProcessDetails.process_id);
                } else {
                    alert('Failed to save step: ' + await readErrorMessage(saveRes));
                    if(progressEl) { progressEl.style.color = 'var(--danger)'; progressEl.textContent = 'Failed'; }
                }
            } catch (e) {
                alert('Connection error.');
                if(progressEl) { progressEl.style.color = 'var(--danger)'; progressEl.textContent = 'Failed'; }
            }
        }

        // Initial Load
        loadProcesses();
    </script>

    <!-- Document Picker Modal -->
    <div id="docPickerModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 16px; box-sizing: border-box;">
        <div style="background: var(--background); width: 100%; max-width: 600px; max-height: 85vh; border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); box-sizing: border-box;">
            <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0; font-size: 1.25rem;">Choose Document</h3>
                <button type="button" onclick="closeDocumentPickerModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: var(--muted-foreground);">&times;</button>
            </div>
            
            <div style="padding: 20px; overflow-y: auto;">
                <h4 style="margin: 0 0 12px 0; font-size: 1rem;">Upload New</h4>
                <div style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 32px;">
                    <input type="file" id="picker-new-upload" style="flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 8px; box-sizing: border-box;">
                    <button type="button" class="btn btn-primary" onclick="uploadNewDocumentFromPicker()" style="white-space: nowrap;">Upload & Select</button>
                </div>
                
                <h4 id="picker-library-heading" style="margin: 0 0 12px 0; font-size: 1rem;">Select from My Library</h4>
                <div id="picker-existing-docs" style="display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: var(--border) transparent; padding-right: 4px;">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Internal Note Modal -->
    <div id="adminNoteModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; padding: 16px; box-sizing: border-box;">
        <div style="background: var(--background); width: 100%; max-width: 500px; border-radius: var(--radius-lg); display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.1); box-sizing: border-box;">
            <div style="padding: 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background-color: #FAF5FF;">
                <h3 style="margin: 0; font-size: 1.25rem; color: #581C87; display: flex; align-items: center; gap: 8px;">
                    <span>🔒</span> Add Internal Note
                </h3>
                <button type="button" onclick="closeAdminNoteModal()" style="background: none; border: none; font-size: 1.5rem; cursor: pointer; color: #9333EA;">&times;</button>
            </div>
            
            <div style="padding: 20px;">
                <p style="margin: 0 0 16px 0; font-size: 0.875rem; color: #6B21A8;">
                    This note will only be visible to administrators. Residents cannot see these comments.
                </p>
                <textarea id="adminNoteInput" style="width: 100%; min-height: 120px; padding: 12px; border: 1px solid #D8B4FE; border-radius: var(--radius-md); font-family: inherit; font-size: 0.9375rem; line-height: 1.5; resize: vertical;" placeholder="Type your internal note here..."></textarea>
                
                <div style="display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 12px; margin-top: 20px;">
                    <button class="btn" style="background-color: white; color: var(--foreground); border: 1px solid var(--border);" onclick="closeAdminNoteModal()">Cancel</button>
                    <button id="adminNoteSubmitBtn" class="btn btn-primary" style="background-color: #9333EA; border: none;" onclick="submitAdminNote()">Save Note</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>

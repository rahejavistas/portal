receivers:
  otlp:
    protocols:
      http:
        endpoint: localhost:4318

exporters:
  otlphttp:
    endpoint: https://otlp-gateway-prod-ap-south-1.grafana.net/otlp
    headers:
      Authorization: ${env:GRAFANA_OTLP_AUTH}

service:
  pipelines:
    metrics:
      receivers: [otlp]
      exporters: [otlphttp]

[package]
name = "base"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "tls-rustls", "postgres"] }
aws-config = "1.1.7"
aws-sdk-s3 = "1.17.0"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
humantime = "2.1"
humantime-serde = "1.1"
opentelemetry = { version = "0.21", features = ["metrics"] }
